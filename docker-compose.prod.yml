services:
  db:
    image: postgres:18-alpine
    container_name: kahoot-db
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on -c max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kahoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: 0.75
    mem_limit: 1536m
    mem_reservation: 1024m
    cpu_shares: 1024
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kahoot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kahoot_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kahoot-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-kahoot};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Maximum Pool Size=64;"
      Jwt__Issuer: ${JWT_ISSUER:-kahoot-api}
      Jwt__Audience: ${JWT_AUDIENCE:-kahoot-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT signing key must be at least 32 characters}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      Seeding__Host__Enabled: ${HOST_SEED_ENABLED:-false}
      Seeding__Host__Username: ${HOST_SEED_USERNAME:-}
      Seeding__Host__Password: ${HOST_SEED_PASSWORD:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      Client__BaseUrl: ${CLIENT_BASE_URL:?CLIENT_BASE_URL is required}
      Observability__Enabled: ${OBSERVABILITY_ENABLED:-false}
      Observability__ServiceName: ${OTEL_SERVICE_NAME:-kahoot-backend}
      Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - uploads_data:/app/uploads
    cpus: 0.75
    mem_limit: 1536m
    mem_reservation: 1024m
    cpu_shares: 1024
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kahoot_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SIGNALR_URL: ${VITE_SIGNALR_URL:-/hubs/game}
    container_name: kahoot-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run:size=8m
      - /var/cache/nginx:size=32m
      - /tmp:size=16m
    cpus: 0.20
    mem_limit: 192m
    mem_reservation: 96m
    cpu_shares: 768
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    networks:
      - kahoot_internal

  nginx:
    image: nginx:1.27.5-alpine
    container_name: kahoot-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run:size=8m
      - /var/cache/nginx:size=32m
      - /tmp:size=32m
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    cpus: 0.20
    mem_limit: 256m
    mem_reservation: 128m
    cpu_shares: 768
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend
    networks:
      - kahoot_internal

volumes:
  postgres_data:
  uploads_data:
  nginx_logs:

networks:
  kahoot_internal:
    driver: bridge
