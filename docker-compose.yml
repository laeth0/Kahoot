services:
  db:
    image: postgres:18-alpine
    container_name: kahoot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kahoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kahoot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kahoot_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kahoot-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-kahoot};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-kahoot-api}
      Jwt__Audience: ${JWT_AUDIENCE:-kahoot-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT signing key must be at least 32 characters}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      Seeding__Host__Username: ${HOST_SEED_USERNAME:-}
      Seeding__Host__Password: ${HOST_SEED_PASSWORD:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Client__BaseUrl: ${CLIENT_BASE_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kahoot_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SIGNALR_URL: ${VITE_SIGNALR_URL:-/hubs/game}
    container_name: kahoot-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - kahoot_internal

volumes:
  postgres_data:
  uploads_data:

networks:
  kahoot_internal:
    driver: bridge
