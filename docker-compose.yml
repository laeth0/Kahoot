# The `deploy` blocks cap each service to model a single small Railway instance
# (one replica + CPU/RAM limits) so local load tests produce numbers that
# transfer. Edit the cpus/memory values below to match your Railway plan.
services:
  db:
    image: postgres:17-alpine
    container_name: kahoot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kahoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # host 5433 -> container 5432 (5432 is usually taken by a local Postgres);
      # the backend still reaches it as db:5432 on the compose network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kahoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kahoot-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=kahoot;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SIGNALR_URL: ""
    container_name: kahoot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
