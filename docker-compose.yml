services:
  db:
    image: postgres:18-alpine
    container_name: kahoot-db
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kahoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: 0.75
    mem_limit: 1536m
    mem_reservation: 1024m
    cpu_shares: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kahoot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kahoot_internal

  postgres-monitor-init:
    image: postgres:18-alpine
    container_name: kahoot-postgres-monitor-init
    restart: "no"
    entrypoint: ["/bin/bash", "/init-monitoring-role.sh"]
    environment:
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:-kahoot_monitor}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-monitor_secret_dev}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-kahoot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - ./observability/postgres/init-monitoring-role.sh:/init-monitoring-role.sh:ro
    cpus: 0.05
    mem_limit: 64m
    mem_reservation: 32m
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kahoot_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kahoot-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-kahoot};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-kahoot-api}
      Jwt__Audience: ${JWT_AUDIENCE:-kahoot-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT signing key must be at least 32 characters}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      Seeding__Host__Enabled: ${HOST_SEED_ENABLED:-false}
      Seeding__Host__Username: ${HOST_SEED_USERNAME:-}
      Seeding__Host__Password: ${HOST_SEED_PASSWORD:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Client__BaseUrl: ${CLIENT_BASE_URL:-http://localhost:3000}
      Observability__Enabled: ${OBSERVABILITY_ENABLED:-true}
      Observability__ServiceName: ${OTEL_SERVICE_NAME:-kahoot-backend}
      Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - uploads_data:/app/uploads
    cpus: 0.75
    mem_limit: 1536m
    mem_reservation: 1024m
    cpu_shares: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kahoot_internal
      - observability_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SIGNALR_URL: ${VITE_SIGNALR_URL:-/hubs/game}
    container_name: kahoot-frontend
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 192m
    mem_reservation: 96m
    cpu_shares: 768
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    networks:
      - kahoot_internal

  nginx:
    image: nginx:alpine
    container_name: kahoot-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    cpus: 0.20
    mem_limit: 256m
    mem_reservation: 128m
    cpu_shares: 768
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend
    networks:
      - kahoot_internal
      - observability_internal

  grafana:
    image: grafana/grafana:13.2.1
    container_name: kahoot-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SERVER_PROTOCOL: http
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_secret}
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    cpus: 0.25
    mem_limit: 384m
    mem_reservation: 256m
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: kahoot-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=4GB'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    cpus: 0.50
    mem_limit: 1024m
    mem_reservation: 768m
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  loki:
    image: grafana/loki:3.7.7
    container_name: kahoot-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    cpus: 0.25
    mem_limit: 512m
    mem_reservation: 384m
    cpu_shares: 192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/local-config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: kahoot-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    user: "0:0"
    command:
      - '--config=/etc/jaeger/jaeger-config.yml'
    volumes:
      - ./observability/jaeger/jaeger-config.yml:/etc/jaeger/jaeger-config.yml:ro
      - jaeger_data:/badger
    cpus: 0.25
    mem_limit: 512m
    mem_reservation: 384m
    cpu_shares: 192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: kahoot-otel-collector
    restart: unless-stopped
    command:
      - '--config=/etc/otelcol-contrib/config.yaml'
    volumes:
      - ./observability/otel/collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      - nginx_logs:/var/log/nginx:ro
    cpus: 0.25
    mem_limit: 384m
    mem_reservation: 256m
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: kahoot-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    cpus: 0.15
    mem_limit: 256m
    mem_reservation: 128m
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: kahoot-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    cpus: 0.10
    mem_limit: 128m
    mem_reservation: 64m
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - observability_internal

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: kahoot-postgres-exporter
    restart: unless-stopped
    command:
      - '--collector.stat_statements'
      - '--no-collector.stat_statements.include_query'
      - '--collector.stat_statements.limit=100'
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_MONITOR_USER:-kahoot_monitor}:${POSTGRES_MONITOR_PASSWORD:-monitor_secret_dev}@db:5432/${POSTGRES_DB:-kahoot}?sslmode=disable"
    cpus: 0.10
    mem_limit: 128m
    mem_reservation: 64m
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kahoot_internal
      - observability_internal

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: kahoot-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    cpus: 0.10
    mem_limit: 128m
    mem_reservation: 64m
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kahoot_internal
      - observability_internal

volumes:
  postgres_data:
  uploads_data:
  certbot_conf:
  certbot_www:
  nginx_logs:
  grafana_data:
  prometheus_data:
  loki_data:
  jaeger_data:

networks:
  kahoot_internal:
    driver: bridge
  observability_internal:
    driver: bridge
    internal: true
