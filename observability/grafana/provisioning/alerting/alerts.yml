apiVersion: 1

groups:
  - orgId: 1
    name: Availability
    folder: Kahoot Observability
    interval: 1m
    rules:
      - uid: kahoot-backend-down
        title: Backend unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: probe_success{job="blackbox",instance="http://backend:8080/health"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Backend health endpoint failed probe.
          runbook_url: docs/observability/alerts.md#kahoot-backend-down
          __dashboardUid__: kahoot-application
          __panelId__: "2"
        labels:
          severity: critical
          component: backend

