receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # ====================================================================================================
  # BACKPRESSURE PATTERN: OpenTelemetry Collector Memory Limiter & Sending Queue
  # ----------------------------------------------------------------------------------------------------
  # Context / Problem:
  # If backend replicas generate a sudden flood of traces/logs, or if storage backends (Jaeger, Loki)
  # slow down, the collector can run out of memory (OOM) buffering telemetry data.
  #
  # Approach & Implementation:
  # 1. memory_limiter: Periodically checks memory usage (check_interval: 1s). If usage reaches 400 MiB,
  #    it asserts backpressure by refusing incoming OTLP batches and returning retryable errors (HTTP 429/503).
  # 2. sending_queue (exporters): Caps in-memory sending buffers to 1000 batches per exporter.
  # ====================================================================================================
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    send_batch_size: 512
    timeout: 5s
    send_batch_max_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 2m
    sending_queue:
      enabled: true
      queue_size: 1000

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 2m
    sending_queue:
      enabled: true
      queue_size: 1000

  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: kahoot
    enable_open_metrics: true
    resource_constant_labels:
      included:
        - deployment.environment.name

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
