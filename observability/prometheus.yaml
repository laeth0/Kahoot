global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "otel-collector-internal"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8888"]
