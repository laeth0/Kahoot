rule_files:
  - recording-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="200"}'
        values: '0+0x10'
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="500"}'
        values: '0+0x10'
    promql_expr_test:
      - expr: kahoot:http_requests:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_requests:rate5m"}'
            value: 0
      - expr: kahoot:http_5xx:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:rate5m"}'
            value: 0
      - expr: kahoot:http_5xx:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:ratio5m"}'
            value: 0

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="200"}'
        values: '0+5886x10'
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="500"}'
        values: '0+114x10'
    promql_expr_test:
      - expr: kahoot:http_requests:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_requests:rate5m"}'
            value: 100
      - expr: kahoot:http_5xx:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:rate5m"}'
            value: 1.9
      - expr: kahoot:http_5xx:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:ratio5m"}'
            value: 0.019

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="200"}'
        values: '0+5874x10'
      - series: 'http_server_request_duration_seconds_count{service_name="kahoot-backend",http_response_status_code="500"}'
        values: '0+126x10'
    promql_expr_test:
      - expr: kahoot:http_requests:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_requests:rate5m"}'
            value: 100
      - expr: kahoot:http_5xx:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:rate5m"}'
            value: 2.1
      - expr: kahoot:http_5xx:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_5xx:ratio5m"}'
            value: 0.021

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="0.5"}'
        values: '0+4500x10'
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="1.0"}'
        values: '0+6000x10'
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="+Inf"}'
        values: '0+6000x10'
    promql_expr_test:
      - expr: kahoot:http_latency:p95_5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_latency:p95_5m"}'
            value: 0.9

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="1.0"}'
        values: '0+10200x10'
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="2.0"}'
        values: '0+10800x10'
      - series: 'http_server_request_duration_seconds_bucket{service_name="kahoot-backend",le="+Inf"}'
        values: '0+10800x10'
    promql_expr_test:
      - expr: kahoot:http_latency:p95_5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:http_latency:p95_5m"}'
            value: 1.1

  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle"}'
        values: '0+12.6x10'
    promql_expr_test:
      - expr: kahoot:vm_cpu:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_cpu:ratio5m"}'
            value: 0.79

  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle"}'
        values: '0+11.4x10'
    promql_expr_test:
      - expr: kahoot:vm_cpu:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_cpu:ratio5m"}'
            value: 0.81

  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '1100000000x10'
      - series: 'node_memory_MemTotal_bytes'
        values: '10000000000x10'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}'
        values: '11000000000x10'
      - series: 'node_filesystem_size_bytes{mountpoint="/",fstype="ext4"}'
        values: '100000000000x10'
    promql_expr_test:
      - expr: kahoot:vm_memory:ratio
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_memory:ratio"}'
            value: 0.89
      - expr: kahoot:vm_disk:ratio
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_disk:ratio",fstype="ext4",mountpoint="/"}'
            value: 0.89

  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '900000000x10'
      - series: 'node_memory_MemTotal_bytes'
        values: '10000000000x10'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}'
        values: '9000000000x10'
      - series: 'node_filesystem_size_bytes{mountpoint="/",fstype="ext4"}'
        values: '100000000000x10'
    promql_expr_test:
      - expr: kahoot:vm_memory:ratio
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_memory:ratio"}'
            value: 0.91
      - expr: kahoot:vm_disk:ratio
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:vm_disk:ratio",fstype="ext4",mountpoint="/"}'
            value: 0.91

  - interval: 1m
    input_series:
      - series: 'probe_success{instance="http://backend:8080/health"}'
        values: '1x10'
      - series: 'probe_success{instance="http://frontend:80/"}'
        values: '0x10'
    promql_expr_test:
      - expr: kahoot:blackbox_success{instance="http://backend:8080/health"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:blackbox_success",instance="http://backend:8080/health"}'
            value: 1
      - expr: kahoot:blackbox_success{instance="http://frontend:80/"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:blackbox_success",instance="http://frontend:80/"}'
            value: 0

  - interval: 1m
    input_series: []
    promql_expr_test:
      - expr: kahoot:vm_cpu:ratio5m
        eval_time: 5m
        exp_samples: []
      - expr: kahoot:vm_memory:ratio
        eval_time: 5m
        exp_samples: []
      - expr: kahoot:vm_disk:ratio
        eval_time: 5m
        exp_samples: []
      - expr: kahoot:blackbox_success
        eval_time: 5m
        exp_samples: []
      - expr: kahoot:signalr_connections
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="kahoot:signalr_connections"}'
            value: 0
